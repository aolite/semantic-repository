[project]
name = "itot-backend"
version = "0.1.0"
description = "API del repositorio semántico IT&OT (FastAPI)"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "owlready2>=0.51",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.0",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pyshacl>=0.40.2",
    "python-multipart>=0.0.33",
    "rdflib>=7.6.0",
    "sqlalchemy>=2",
    "typer>=0.29.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "BLE", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
