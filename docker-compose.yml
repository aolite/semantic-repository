# Entorno local del repositorio semántico IT&OT.
# Uso: cp .env.example .env && docker compose up -d --build
# Todos los servicios solo escuchan en 127.0.0.1.
#
# Fuseki: imagen secoresearch/fuseki. Es una imagen mantenida (6.2.0 publicada en
# agosto de 2026, Jena 6.x), multi-arquitectura (amd64 y arm64) y configurable con
# un assembler montado. stain/jena-fuseki está abandonada y no tiene arm64; el
# proyecto Apache Jena no publica una imagen oficial lista para usar.

name: itot

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  fuseki:
    image: secoresearch/fuseki:6.2.0
    restart: unless-stopped
    # infra/fuseki/entrypoint.sh genera shiro.ini desde la plantilla infra/fuseki/shiro.ini
    # (con las contraseñas de admin y backend) antes del entrypoint original de la imagen,
    # que no admite montar el fichero directamente.
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    # CMD original de la imagen; el entrypoint lo pasa al de la imagen.
    command: ["java", "-cp", "*:/javalibs/*", "org.apache.jena.fuseki.main.cmds.FusekiServerCmd"]
    environment:
      # Contraseñas de los usuarios admin y backend: las escribe infra/fuseki/entrypoint.sh
      # en shiro.ini.
      FUSEKI_ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:?define FUSEKI_ADMIN_PASSWORD en .env (ver .env.example)}
      FUSEKI_BACKEND_PASSWORD: ${FUSEKI_BACKEND_PASSWORD:?define FUSEKI_BACKEND_PASSWORD en .env (ver .env.example)}
    ports:
      - "127.0.0.1:${FUSEKI_HOST_PORT:-3030}:3030"
    volumes:
      - fuseki-data:/fuseki-base/databases
      - ./infra/fuseki/assembler.ttl:/fuseki-base/configuration/assembler.ttl:ro
      - ./infra/fuseki/shiro.ini:/shiro.ini.template:ro
      - ./infra/fuseki/entrypoint.sh:/entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3030/$$/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # F-UJI (evaluador FAIR). infra/fuji/Dockerfile parte de la imagen oficial del proyecto
  # pangaea-data-publisher/fuji (tag 4.0.1) fijada por digest y le añade el Chromium que la
  # imagen oficial no trae y sin el cual no arranca. Solo hay imagen linux/amd64: en arm64
  # (Apple Silicon) corre emulada, de ahí `platform` y el start_period largo. Sin puertos en
  # el host.
  # Solo está en la red interna `fuji-net` (internal: true, sin salida a internet) junto al
  # backend: ver "F-UJI y llamadas externas" en infra/README.md.
  fuji:
    build:
      context: ./infra/fuji
    image: itot-fuji:4.0.1
    platform: linux/amd64
    restart: unless-stopped
    # La imagen refresca la lista de repositorios de DataCite al arrancar si su fichero tiene
    # más de 24 h; el `touch` lo evita y usa la lista incluida (ver infra/README.md).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - touch /usr/src/app/fuji_server/data/repodois.yaml && exec python3 -m fuji_server -c /usr/src/app/fuji_server/config/server.ini
    environment:
      FUJI_USERNAME: ${FUJI_USERNAME:?define FUJI_USERNAME en .env (ver .env.example)}
      FUJI_PASSWORD: ${FUJI_PASSWORD:?define FUJI_PASSWORD en .env (ver .env.example)}
    volumes:
      # Sustituye a los usuarios de ejemplo de la imagen por los de FUJI_USERNAME/FUJI_PASSWORD.
      - ./infra/fuji/users.py:/usr/src/app/fuji_server/config/users.py:ro
    networks:
      - fuji-net
    healthcheck:
      # La imagen no trae curl ni wget: se usa Python. La interfaz Swagger no pide credenciales.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1071/fuji/api/v1/ui/', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    # Estas variables tienen prioridad sobre las del env_file.
    environment:
      # Ruta dentro del contenedor de los datos semánticos (montados abajo).
      SEMANTIC_DIR: /semantic
      # Usuario y contraseña de escritura en Fuseki: usuario `backend`, con su propia
      # contraseña (FUSEKI_BACKEND_PASSWORD). `admin` queda solo para administrar Fuseki.
      FUSEKI_USER: ${FUSEKI_USER:-backend}
      FUSEKI_PASSWORD: ${FUSEKI_BACKEND_PASSWORD:?define FUSEKI_BACKEND_PASSWORD en .env (ver .env.example)}
      # URL base que el backend pasa a F-UJI. F-UJI está en `fuji-net`, sin salida a
      # internet, así que por defecto apunta al backend por la red interna; sin esto se
      # usaría BASE_URI y la evaluación fallaría.
      FAIR_TARGET_BASE_URL: ${FAIR_TARGET_BASE_URL:-http://backend:8000/}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - distributions:/data/distributions
      - ./semantic:/semantic:ro
    depends_on:
      postgres:
        condition: service_healthy
      fuseki:
        condition: service_healthy
      # La API arranca y funciona aunque F-UJI no esté disponible (la evaluación queda
      # `failed` o `pending`): `required: false` solo avisa si F-UJI no llega a estar sano.
      fuji:
        condition: service_healthy
        required: false
    networks:
      - default
      - fuji-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    # Solo las variables públicas: el frontend no debe recibir secretos.
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_BASE_URI: ${VITE_BASE_URI}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Vite escucha en IPv4 (0.0.0.0): se usa 127.0.0.1 y no localhost, que en
      # Alpine puede resolver a ::1. wget es el de busybox, incluido en la imagen.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

networks:
  # Red sin salida a internet (internal: true) compartida por el backend y F-UJI. F-UJI solo
  # alcanza al backend; no puede llamar a servicios externos (ver infra/README.md).
  fuji-net:
    internal: true

volumes:
  postgres-data:
  fuseki-data:
  distributions:
