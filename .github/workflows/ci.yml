name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Cada job detecta si la carpeta de su capa ya existe y, si no, se salta los pasos:
# las PR de cada capa llegan por separado.

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detectar capa
        id: layer
        run: |
          if [ -f backend/pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "backend/pyproject.toml no existe: se salta el job"; fi
      - if: steps.layer.outputs.present == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Lint y pruebas
        if: steps.layer.outputs.present == 'true'
        working-directory: backend
        run: uv sync --frozen && uv run ruff check . && uv run pytest
      - name: Auditoría de dependencias (pip-audit)
        if: steps.layer.outputs.present == 'true'
        working-directory: backend
        run: |
          uv export --frozen --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detectar capa
        id: layer
        run: |
          if [ -f frontend/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "frontend/package.json no existe: se salta el job"; fi
      - if: steps.layer.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint, pruebas y build
        if: steps.layer.outputs.present == 'true'
        working-directory: frontend
        run: npm ci && npm run lint && npm test -- --run && npm run build
      - name: Auditoría de dependencias (npm audit)
        if: steps.layer.outputs.present == 'true'
        working-directory: frontend
        run: npm audit --audit-level=high

  semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detectar capa
        id: layer
        run: |
          if [ -f semantic/scripts/validate.py ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "semantic/scripts/validate.py no existe: se salta el job"; fi
      - if: steps.layer.outputs.present == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Validar con SHACL
        if: steps.layer.outputs.present == 'true'
        run: uv run semantic/scripts/validate.py

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validar docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config -q

  # PROPUESTA pendiente de decisión del responsable: se puede quitar este job sin más.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Pruebas de extremo a extremo (Compose real)
        env:
          E2E_REQUIRE_DOCKER: "1"
        run: uv run --frozen --project backend pytest tests/e2e -v
