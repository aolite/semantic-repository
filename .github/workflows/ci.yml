name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Cada job detecta si la carpeta de su capa ya existe y, si no, se salta los pasos:
# las PR de cada capa llegan por separado.

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detectar capa
        id: layer
        run: |
          if [ -f backend/pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "backend/pyproject.toml no existe: se salta el job"; fi
      - if: steps.layer.outputs.present == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Java 25 para owlready2 + Pellet: el Jena de owlready2 0.51 está compilado para Java 25
      # (class file 69); con una versión anterior las pruebas de Pellet se saltan.
      - if: steps.layer.outputs.present == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Lint y pruebas
        if: steps.layer.outputs.present == 'true'
        working-directory: backend
        run: uv sync --frozen && uv run ruff check . && uv run pytest
      - name: Auditoría de dependencias (pip-audit)
        if: steps.layer.outputs.present == 'true'
        working-directory: backend
        run: |
          uv export --frozen --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detectar capa
        id: layer
        run: |
          if [ -f frontend/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "frontend/package.json no existe: se salta el job"; fi
      - if: steps.layer.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint, pruebas y build
        if: steps.layer.outputs.present == 'true'
        working-directory: frontend
        run: npm ci && npm run lint && npm test -- --run && npm run build
      - name: Auditoría de dependencias (npm audit)
        if: steps.layer.outputs.present == 'true'
        working-directory: frontend
        run: npm audit --audit-level=high

  semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detectar capa
        id: layer
        run: |
          if [ -f semantic/scripts/validate.py ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "semantic/scripts/validate.py no existe: se salta el job"; fi
      - if: steps.layer.outputs.present == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Validar con SHACL
        if: steps.layer.outputs.present == 'true'
        run: uv run semantic/scripts/validate.py

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validar docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config -q

  # PROPUESTA pendiente de decisión del responsable: se puede quitar este job sin más.
  # Desde la fase 4 el Compose incluye F-UJI (se construye desde infra/fuji, unos 90 s): la
  # e2e lo levanta con el resto de servicios y la prueba de G4 lo evalúa de verdad.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Pruebas de extremo a extremo (Compose real)
        env:
          E2E_REQUIRE_DOCKER: "1"
        run: uv run --frozen --project backend pytest tests/e2e -v

  # PROPUESTA pendiente de decisión del responsable (QA-G3-12): pip-audit no cubre los JAR
  # que trae owlready2 (Jena, OWL API, log4j...). Se puede quitar este job sin más.
  # Corre en PR y en push a main (como el resto del workflow). No sube resultados a ningún
  # servicio externo; Trivy solo descarga su base de vulnerabilidades de ghcr.io (GitHub).
  imagen-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construir la imagen del backend
        run: |
          if [ -f backend/Dockerfile ]; then docker build -t backend-scan:ci backend; else echo "sin Dockerfile: se salta"; fi
      - name: Analizar la imagen con Trivy (falla con hallazgos críticos)
        if: hashFiles('backend/Dockerfile') != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: backend-scan:ci
          version: v0.76.2
          # Única excepción: CVE-2026-114820 (JRE solo para Pellet, sin corrección en
          # Debian 13), con caducidad en .trivyignore.yaml. Ver infra/README.md.
          trivyignores: .trivyignore.yaml
          severity: CRITICAL
          exit-code: "1"
          format: table
          vuln-type: os,library

  # Pruebas de pantallas con Playwright (decisión 34). Levanta el Compose real (incluido
  # F-UJI), carga los datos sintéticos y ejecuta tests/browser/ con Chromium.
  # Como las pruebas las escribe `qa` aparte, el job se salta (y pasa en verde) mientras
  # no exista tests/browser/package.json: se activa solo al integrarlas, sin tocar este
  # fichero. Las pruebas reciben BASE_URL (frontend) y API_URL (backend).
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detectar capa
        id: layer
        run: |
          if [ -f tests/browser/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "tests/browser/package.json no existe: se salta el job"; fi
      - if: steps.layer.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Preparar .env con secretos aleatorios
        if: steps.layer.outputs.present == 'true'
        run: |
          cp .env.example .env
          set_var() { sed -i "s|^$1=.*|$1=$2|" .env; }
          set_var JWT_SECRET "$(openssl rand -hex 32)"
          set_var FUSEKI_ADMIN_PASSWORD "$(openssl rand -hex 16)"
          set_var FUSEKI_BACKEND_PASSWORD "$(openssl rand -hex 16)"
          set_var FUJI_PASSWORD "$(openssl rand -hex 16)"
          PG_PASSWORD="$(openssl rand -hex 16)"
          set_var POSTGRES_PASSWORD "$PG_PASSWORD"
          set_var DATABASE_URL "postgresql+psycopg://itot:${PG_PASSWORD}@postgres:5432/itot"
      - name: Levantar el Compose
        if: steps.layer.outputs.present == 'true'
        run: docker compose up -d --build --wait --wait-timeout 900
      - name: Cargar los datos sintéticos
        if: steps.layer.outputs.present == 'true'
        run: docker compose exec -T backend python -m app.cli load-semantic
      - name: Instalar dependencias y Chromium
        if: steps.layer.outputs.present == 'true'
        working-directory: tests/browser
        run: npm ci && npx playwright install --with-deps chromium
      - name: Ejecutar las pruebas de pantallas
        if: steps.layer.outputs.present == 'true'
        working-directory: tests/browser
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:8000
          CI: "true"
        run: npx playwright test
      - name: Subir informe y trazas (solo si falla)
        if: failure() && steps.layer.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            tests/browser/playwright-report/
            tests/browser/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Registros del Compose (solo si falla)
        if: failure() && steps.layer.outputs.present == 'true'
        run: docker compose logs --no-color --tail 200
      - name: Apagar el Compose
        if: always() && steps.layer.outputs.present == 'true'
        run: docker compose down -v
