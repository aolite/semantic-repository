name: Publicar ontología o vocabulario

# «Publicar» en la fase 3 = crear una Release de GitHub con el RDF de la versión
# y su documentación. No despliega nada: la carga en un entorno se hace con
# `load-semantic` (ver infra/README.md). El despliegue automático llega en la fase 5.
#
# Etiquetas:
#   onto/{slug}/v{version}        -> semantic/ontologias/{slug}/{version}.ttl
#   vocab/{slug}/v{version}       -> semantic/vocabularios/{slug}.ttl
#   vocab/corp/{slug}/v{version}  -> semantic/vocabularios/corp/{slug}.ttl

on:
  push:
    tags:
      - "onto/*/v*"
      - "vocab/*/v*"
      - "vocab/corp/*/v*"

permissions:
  contents: read

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

env:
  # Variables del repositorio (Settings > Variables); si no existen, se usan estos valores.
  BASE_URI: ${{ vars.BASE_URI || 'https://semantic.example.org/itot/' }}
  # Propiedad del skos:ConceptScheme con la versión. «none» desactiva la comprobación.
  SKOS_VERSION_PREDICATE: ${{ vars.SKOS_VERSION_PREDICATE || 'http://www.w3.org/2002/07/owl#versionInfo' }}
  # Idioma de la documentación WIDOCO. Con varios idiomas (es,en) la versión 1.4.26 falla en LODE.
  WIDOCO_LANG: ${{ vars.WIDOCO_LANG || 'es' }}
  # WIDOCO se descarga de su Release de GitHub, fijado por versión y SHA-256.
  # No hay imagen Docker oficial verificable: el JAR con dependencias es el artefacto oficial.
  WIDOCO_VERSION: "1.4.26"
  WIDOCO_SHA256: "6cb1efc20c213206bb2bcf0591a8c73c16c64765acb8ad411225e619b5d77b66"

jobs:
  construir:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Comprobar que la etiqueta apunta a un commit de main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: el commit de la etiqueta no está en main" >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Validar con SHACL
        run: uv run semantic/scripts/validate.py

      - name: Comprobar etiqueta, versión y expandir IRIs con BASE_URI
        id: prep
        env:
          TAG: ${{ github.ref_name }}
        run: uv run infra/scripts/publicar.py --tag "$TAG" --out build

      - name: Instalar Java (para WIDOCO)
        if: steps.prep.outputs.kind == 'onto'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Documentación con WIDOCO
        if: steps.prep.outputs.kind == 'onto'
        env:
          NAME: ${{ steps.prep.outputs.name }}
        run: |
          jar="widoco-${WIDOCO_VERSION}-jar-with-dependencies_JDK-17.jar"
          curl -fsSL -o widoco.jar \
            "https://github.com/dgarijo/Widoco/releases/download/v${WIDOCO_VERSION}/${jar}"
          echo "${WIDOCO_SHA256}  widoco.jar" | sha256sum -c -
          # WIDOCO crea una carpeta temporal en el directorio actual: se ejecuta fuera del repositorio.
          mkdir -p "$RUNNER_TEMP/widoco"
          cp "build/${NAME}.rdf" "$RUNNER_TEMP/widoco/ontologia.rdf"
          (cd "$RUNNER_TEMP/widoco" && java -jar "$GITHUB_WORKSPACE/widoco.jar" \
            -ontFile ontologia.rdf -outFolder docs -rewriteAll -lang "$WIDOCO_LANG" -webVowl)
          mkdir -p build/docs
          cp -r "$RUNNER_TEMP/widoco/docs/." build/docs/
          # Con un solo idioma WIDOCO nombra la página index-{lang}.html
          first_lang="${WIDOCO_LANG%%,*}"
          cp "build/docs/index-${first_lang}.html" build/docs/index.html

      - name: Empaquetar documentación y notas de la Release
        env:
          NAME: ${{ steps.prep.outputs.name }}
          KIND: ${{ steps.prep.outputs.kind }}
          SOURCE: ${{ steps.prep.outputs.source }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd build/docs && zip -qr "../${NAME}-docs.zip" .)
          rm -rf build/docs
          {
            echo "Versión publicada de \`${TAG}\`."
            echo
            echo "- Fuente: \`${SOURCE}\` (commit ${GITHUB_SHA})"
            echo "- IRIs expandidas con \`BASE_URI\` = \`${BASE_URI}\`"
            echo "- Validado con las formas SHACL de \`semantic/shapes/\`"
            echo "- Documentación: \`${NAME}-docs.zip\` (abre \`index.html\`)"
            echo
            echo "Para cargarla en un entorno, ver \`infra/README.md\` (load-semantic)."
          } > build/notas.md
          ls -l build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: build/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: construir
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: build

      - name: Crear la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(build/*.ttl build/*.jsonld build/*.rdf build/*.zip)
          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file build/notas.md
