# Seguridad de Fuseki. Plantilla: se copia a /fuseki-base/shiro.ini al arrancar
# y la imagen sustituye la línea "admin=" por FUSEKI_ADMIN_PASSWORD.
# Las consultas (/itot/query y /itot/sparql) son anónimas; el resto exige
# autenticación Basic como admin (solo el backend escribe en el triplestore).
[main]
ssl.enabled = false
plainMatcher=org.apache.shiro.authc.credential.SimpleCredentialsMatcher
iniRealm.credentialsMatcher = $plainMatcher

[users]
admin=placeholder

[roles]

[urls]
/$/status = anon
/$/ping   = anon
/$/** = authcBasic,user[admin]
/itot/update = authcBasic,user[admin]
/itot/data = authcBasic,user[admin]
/itot/shacl = authcBasic,user[admin]
/itot/query = anon
/itot/sparql = anon
# Cualquier otra ruta: denegada salvo admin
/** = authcBasic,user[admin]
