# Seguridad de Fuseki. Plantilla: infra/fuseki/entrypoint.sh la copia a
# /fuseki-base/shiro.ini al arrancar y sustituye las líneas "admin=placeholder" y
# "backend=placeholder" por las contraseñas FUSEKI_ADMIN_PASSWORD y FUSEKI_BACKEND_PASSWORD,
# con sus roles.
# Las consultas (/itot/query y /itot/sparql) son anónimas. Los usuarios son:
#   - backend (rol writer): escribe en el dataset itot (update, data y shacl). Es el que
#     usa la API. No puede usar la administración de Fuseki.
#   - admin (roles admin y writer): administración de Fuseki (/$/...) y escritura.
# Ojo: el filtro user[...] de Shiro no comprueba el usuario (acepta a cualquier autenticado),
# por eso se usa roles[...]. fuseki:allowedUsers de assembler.ttl repite la restricción.
[main]
ssl.enabled = false
plainMatcher=org.apache.shiro.authc.credential.SimpleCredentialsMatcher
iniRealm.credentialsMatcher = $plainMatcher

[users]
admin=placeholder
backend=placeholder

[roles]

[urls]
/$/status = anon
/$/ping   = anon
/$/** = authcBasic,roles[admin]
/itot/update = authcBasic,roles[writer]
/itot/data = authcBasic,roles[writer]
/itot/shacl = authcBasic,roles[writer]
/itot/query = anon
/itot/sparql = anon
# Cualquier otra ruta: denegada salvo admin
/** = authcBasic,roles[admin]
